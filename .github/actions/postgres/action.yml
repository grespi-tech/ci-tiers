name: postgres
description: >
  Start a throwaway Postgres container on a free 127.0.0.1 port and export
  PGHOST/PGPORT/PGUSER/PGPASSWORD/PGCONTAINER. Data lives in tmpfs. Capped and
  at low CPU priority because job containers run outside the runners' cgroup.
  Composite actions have no post step: the job removes $PGCONTAINER itself.

inputs:
  image:
    default: postgres:17
  databases:
    description: Space-separated databases to create besides the default `postgres`.
    default: ''
  cpus:
    default: '1'
  memory:
    default: 1g

runs:
  using: composite
  steps:
    - shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DATABASES: ${{ inputs.databases }}
        CPUS: ${{ inputs.cpus }}
        MEMORY: ${{ inputs.memory }}
      run: |
        set -euo pipefail
        name="ci-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
        docker rm -f "$name" >/dev/null 2>&1 || true
        # Port 0: Docker picks a free port, so concurrent jobs on one box never collide.
        docker run -d --rm --name "$name" --cpus "$CPUS" --memory "$MEMORY" --cpu-shares 256 \
          -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
          --tmpfs /var/lib/postgresql/data \
          -p 127.0.0.1:0:5432 "$IMAGE" >/dev/null
        port=$(docker port "$name" 5432/tcp | head -n1 | cut -d: -f2)
        for _ in $(seq 1 60); do
          docker exec "$name" pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1 && break
          sleep 1
        done
        docker exec "$name" pg_isready -U postgres -h 127.0.0.1
        for db in $DATABASES; do
          docker exec "$name" psql -U postgres -v ON_ERROR_STOP=1 -qc "CREATE DATABASE \"$db\""
        done
        {
          echo "PGCONTAINER=$name"
          echo "PGHOST=127.0.0.1"
          echo "PGPORT=$port"
          echo "PGUSER=postgres"
          echo "PGPASSWORD=postgres"
        } >> "$GITHUB_ENV"
        echo "Postgres $IMAGE on 127.0.0.1:$port"
